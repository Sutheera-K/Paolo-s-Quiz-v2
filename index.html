      {n:159,type:"mc",q:"Le caldaie di rame creano «competizione batterica». Perché questa caratteristica è tecnicamente coerente con un formaggio prodotto da latte crudo?",opts:["Il rame uccide tutti i batteri, sostituendo la pastorizzazione.","Il latte crudo contiene una microflora variabile e potenzialmente sbilanciata; il rame, attraverso il rilascio di ioni in tracce, esercita una pressione selettiva che limita microrganismi indesiderati e favorisce i batteri lattici «buoni» del siero-innesto, fungendo da regolatore senza eliminare la flora utile.","Il rame aggiunge un sapore metallico al formaggio.","È una scelta puramente estetica."],correct:1,exp:"Le slide spiegano che il rame «serve a creare competizione batterica». Il rame in tracce inibisce alcuni microrganismi indesiderati senza distruggere la flora utile del siero-innesto, fungendo da regolatore selettivo: scelta sensata in un latte crudo non pastorizzato."},
      {n:160,type:"mc",q:"Cosa accadrebbe se la rottura della cagliata fosse più grossolana, fino a granuli grandi come noci anziché chicchi di riso?",opts:["Si otterrebbe un Parmigiano di migliore qualità, perché meno lavorato.","Si avrebbe minore espulsione del siero, dunque maggiore ritenzione di acqua nella massa caseosa: il formaggio risulterebbe più morbido, meno adatto alla lunga stagionatura — è il principio di base che differenzia formaggi a pasta dura dai formaggi a pasta molle.","Aumenterebbe la coagulazione iniziale.","La temperatura di cottura della cagliata si abbasserebbe automaticamente."],correct:1,exp:"Le slide affermano: «Più la rottura è fine, maggiore è l'espulsione del siero — fondamentale per un formaggio a pasta dura». Una rottura grossolana invertirebbe il principio: maggiore acqua trattenuta → pasta più morbida → formaggio non adatto alla lunga stagionatura."},
      {n:161,type:"vf",q:"Il fatto che il siero-innesto sia uno «scarto del giorno prima» realizza tecnicamente una continuità microbica: ogni caldaia eredita i batteri lattici della precedente, mantenendo nel tempo una identità microbiologica del singolo caseificio — concetto coerente con il legame territoriale del DOP.",correct:true,exp:"Il siero-innesto naturale ottenuto come scarto del giorno prima realizza una catena microbica continua nel tempo, propria del singolo caseificio. È esattamente il tipo di legame microbico-territoriale che fonda concettualmente le DOP."},
      {n:162,type:"mc",q:"Negli assaggi sono stati confrontati Parmigiano 24 mesi prodotti da frisona, bruna alpina, vacca bianca e vacca rossa. Perché ha senso, dal punto di vista tecnologico, fare questo confronto?",opts:["Per mostrare che il latte di razze diverse ha composizione differente (proteine, grassi, caseine, β-caroteni), e quindi anche a parità di lavorazione e stagionatura il profilo organolettico finale può variare sensibilmente — confronto utile per allenare il panel.","Per dimostrare che le razze non incidono sul prodotto finale.","Perché ogni razza richiede un disciplinare diverso.","Per valutare la dieta degli animali invece che il latte."],correct:0,exp:"Razze diverse hanno latte con composizione diversa: percentuali di grassi, caseine, β-caroteni e profilo aromatico variabili. A parità di lavorazione e stagionatura, il prodotto finale può differire significativamente: confronto eccellente per allenare il palato."},
      {n:163,type:"mc",q:"Una forma di Parmigiano, al controllo dei 12 mesi, riceve il marchio «mezzano». Cosa puoi dedurre dal punto di vista tecnico?",opts:["Il formaggio è scaduto.","La forma presenta difetti che impediscono l'attribuzione del marchio a fuoco di Parmigiano Reggiano DOP, ma rimane commercializzabile in declassamento; tipicamente difetti di occhiatura, gusto o struttura. È il sistema di tutela qualitativa interno al consorzio.","Il formaggio è stato pastorizzato, contro il disciplinare.","È stato prodotto fuori dalle province autorizzate."],correct:1,exp:"Il marchio «mezzano» indica una forma con difetti che impediscono l'attribuzione del marchio a fuoco DOP. Tipicamente difetti di occhiatura, sapore, struttura. È il sistema di tutela del consorzio: declassamento commerciale."},
      {n:164,type:"mc",q:"La salamoia avviene per 18-20 giorni, in soluzione satura 1,3%. Perché è importante che il sale penetri «lentamente» piuttosto che salare la cagliata in fase di lavorazione?",opts:["Per ridurre i costi di trasporto.","La penetrazione lenta del sale realizza una salatura graduale e omogenea della pasta, evita inibizioni precoci dei batteri lattici (necessari nelle prime fasi della stagionatura) e contribuisce a una corretta formazione della crosta — funzioni che sarebbero compromesse da una salatura nell'impasto.","Per ridurre l'acidità del latte.","Per favorire la pastorizzazione."],correct:1,exp:"La salatura per immersione lenta evita inibizioni precoci dei batteri lattici, garantisce omogeneità della distribuzione del sale nella forma, e contribuisce alla formazione della crosta come barriera."},
    ]
  },
  {
    title: "Aceto Balsamico: Ragionamento e Confronto",
    subtitle: "Capitolo 7 (Avanzato) — Confronti normativi e logica del processo",
    advanced: true,
    qs: [
      {n:165,type:"mc",q:"Confrontando le tre tipologie principali, ti viene chiesto di stabilire la differenza fondamentale tra il Tradizionale DOP e l'IGP. Quale formulazione è più precisa?",opts:["Solo la zona di produzione: il DOP è di Modena, l'IGP è italiano in generale.","È una differenza di natura storica e disciplinare: il DOP risponde a una tradizione antica con vincoli rigorosi (saba come materia prima, batteria di botti, minimo 12 anni, bottiglia Giugiaro 100 ml, parametri molto stringenti); l'IGP nasce nel 2009 come risposta alla domanda commerciale, con disciplinare più snello.","Solo il prezzo: il DOP costa di più.","Solo la presenza del caramello."],correct:1,exp:"Le slide indicano due differenze fondamentali: (i) storica — DOP tradizione antica, IGP risposta commerciale del 2009; (ii) disciplinare — DOP basato su saba e batteria di botti per ≥ 12 anni con parametri stringenti (densità 1,24, acidità ≥ 4,5%); IGP basato su miscela con tempi ridotti e parametri più permissivi."},
      {n:166,type:"mc",q:"Le botti della batteria sono «vecchie, spesso provenienti dal vino». Perché questo è un requisito tecnicamente sensato e non una semplice scelta tradizionale?",opts:["Perché le botti nuove sono più costose.","Le botti vecchie cedono meno tannini e aromi propri del legno, lasciando emergere il profilo del prodotto; inoltre la microporosità ormai stabilizzata favorisce gli scambi gas-liquido necessari all'evaporazione e all'ossidazione lenta che caratterizzano il balsamico, senza «coprire» con aromi di legno fresco.","Perché solo le botti vecchie possono ospitare batteri acetici.","Perché le botti nuove sono ermeticamente chiuse."],correct:1,exp:"Le botti vecchie hanno già ceduto buona parte dei tannini e degli aromi propri del legno, evitando di «coprire» il prodotto. La microporosità stabilizzata permette gli scambi gas-liquido necessari per evaporazione e ossidazione lenta."},
      {n:167,type:"mc",q:"Le botti della batteria NON vengono chiuse ermeticamente. Perché questa è una scelta tecnica fondamentale e non un'imprecisione?",opts:["Per ridurre i costi di produzione.","L'apertura permette l'evaporazione naturale (10% all'anno), che concentra il prodotto, e l'ingresso di ossigeno necessario ai batteri acetici per trasformare gli zuccheri/etanolo in acido acetico: chiudere ermeticamente bloccherebbe sia la concentrazione sia la fermentazione acetica.","Per facilitare l'ispezione visiva.","Per evitare il deterioramento del legno."],correct:1,exp:"L'apertura permette l'evaporazione naturale (10%/anno), che concentra il prodotto, e l'ingresso di ossigeno necessario ai batteri acetici. Chiusura ermetica → niente evaporazione → niente concentrazione; niente ossigeno → niente fermentazione acetica."},
      {n:168,type:"mc",q:"Spiega perché il sistema di rincalzo «dalla botte più piccola con la successiva, fino a ricolmare l'ultima con mosto cotto nuovo» non è semplicemente un metodo di riempimento ma un meccanismo di affinamento.",opts:["È un metodo di riempimento, niente di più.","Realizza una stratificazione di età: la botte più piccola contiene il prodotto più vecchio e concentrato, mentre il mosto giovane entra solo nell'ultima; ogni anno il prodotto «scivola» di una posizione, garantendo che ogni bottiglia imbottigliata dalla botte piccola contenga sempre tracce di tutte le annate precedenti — è un sistema simile al «solera» dello sherry.","Serve per pulire le botti.","Inverte la composizione tra mosto e aceto."],correct:1,exp:"Il sistema descritto realizza una stratificazione di età analoga al «solera» dello sherry: la botte più piccola contiene il prodotto più maturo e concentrato, l'ultima la materia prima fresca. Ogni anno il prodotto «scivola» di una posizione."},
      {n:169,type:"vf",q:"Considerando che la batteria può avere da 3 a 7 botti e la durata minima del ciclo è 12 anni, una batteria di 3 botti rappresenta il limite minimo del sistema di stratificazione descritto, mentre 7 botti permettono una progressione molto più graduale e maggiore complessità del prodotto finale.",correct:true,exp:"Una batteria di 3 botti rappresenta lo schema minimo di stratificazione (almeno tre stadi: ricolmo iniziale, intermedio, prelievo finale). 7 botti permettono una progressione molto più graduale, con ogni stadio che apporta un contributo aromatico distinto."},
      {n:170,type:"mc",q:"Confronta il prezzo del Tradizionale di Modena DOP (900-1200 €/L) con quello dell'IGP (qualche euro al litro per le versioni base). Quale ragionamento spiega meglio il divario?",opts:["Il DOP usa uve più costose.","Il divario riflette: la produzione molto limitata (~320-330 mila bottiglie/anno per Modena, ~160 mila per Reggio); il tempo (≥ 12 anni, contro 60 giorni o 3 anni); l'evaporazione (10% annuo per molti anni); la materia prima (saba, non aceto di vino + mosto); la batteria di botti che richiede investimento generazionale.","Solo la bottiglia di Giugiaro giustifica il prezzo.","Le uve del Tradizionale sono biologiche obbligatoriamente."],correct:1,exp:"Il divario di prezzo riflette economia totalmente diversa: produzione molto limitata, ciclo di ≥ 12 anni con perdita del 10% annuo per evaporazione, materia prima nobile (saba), investimento generazionale nella batteria."},
      {n:171,type:"mc",q:"Negli assaggi vengono proposti, in sequenza, saba pura → balsamico DOP giovane → extravecchio Giusti → ABTM con anni crescenti. Quale è la logica didattica di questa progressione?",opts:["Andare dal più dolce al più acido in modo casuale.","Mostrare l'evoluzione del prodotto lungo la sua filiera: dalla materia prima (saba) attraverso le diverse durate di affinamento, per capire come tempo, evaporazione e botti modificano dolcezza, acidità, densità e complessità aromatica.","Confrontare prodotti di consorzi diversi.","Verificare la presenza di caramello aggiunto."],correct:1,exp:"La sequenza degli assaggi attraversa la filiera del prodotto: saba (materia prima base) → balsamico giovane → extravecchi di durata crescente. Permette di osservare empiricamente come tempo, evaporazione e batteria modifichino dolcezza, acidità, densità, complessità."},
      {n:172,type:"mc",q:"Un produttore di IGP usa mosto concentrato anziché mosto cotto. Quale è la motivazione industriale implicita e quale concessione normativa lo accompagna?",opts:["Il mosto concentrato è più aromatico.","Il mosto concentrato è ottenuto industrialmente per esigenze di colore e standardizzazione produttiva; come compensazione (che riconosce questa minore «naturalità»), il disciplinare ammette fino al 2% di caramello — concessione che NON è invece prevista per il Tradizionale DOP.","Il mosto concentrato è obbligatorio per legge.","Costa più del mosto cotto."],correct:1,exp:"Il mosto concentrato è un prodotto industriale (per esigenze di colore e standardizzazione); il disciplinare IGP ammette una compensazione: 2% di caramello quando si usa concentrato. Il DOP, vincolato alla saba e alla tradizione, non concede questa flessibilità."},
      {n:173,type:"mc",q:"Acidità: per il Tradizionale DOP è ≥ 4,5%, per l'IGP «mezzo balsamico» è 6%. Considerando che il DOP subisce 12+ anni di affinamento mentre l'IGP base anche solo 60 giorni, come spieghi che l'IGP abbia acidità MAGGIORE del DOP?",opts:["È un errore del disciplinare.","Nell'IGP la fonte principale di acidità è l'aceto di vino aggiunto direttamente alla ricetta (almeno 10%), che è già acido al momento della miscelazione; nel DOP l'acidità si sviluppa per fermentazione lenta dei batteri acetici nelle botti, partendo dalla saba zuccherina, e rimane per disciplinare a livelli più contenuti perché il prodotto finale punta su equilibrio dolce-acido.","Solo l'IGP usa acido acetico sintetico.","Sono due parametri non confrontabili."],correct:1,exp:"Apparente paradosso. Spiegazione: l'IGP usa direttamente aceto di vino già acido nella ricetta (almeno 10% + 10% di aceto madre), che porta acidità immediata. Il DOP sviluppa acidità più lenta e contenuta tramite fermentazione acetica della saba zuccherina."},
      {n:174,type:"mc",q:"La densità del Tradizionale DOP a 20°C è 1,24, mentre per il «mezzo balsamico» IGP è 1,06. Cosa dice tecnicamente questa differenza?",opts:["Il DOP è acquoso.","La densità riflette la concentrazione di solidi solubili (zuccheri residui, polifenoli, composti complessi sviluppati negli anni di affinamento): 1,24 indica un prodotto sciropposo e molto concentrato, mentre 1,06 indica un prodotto fluido, più diluito — coerente con l'evaporazione del 10%/anno tipica del DOP.","È solo una differenza di colore.","È una caratteristica del legno delle botti."],correct:1,exp:"Densità = misura di solidi solubili. 1,24 indica un prodotto sciropposo, denso, molto concentrato dopo molti anni di evaporazione (10%/anno). 1,06 è un valore vicino a quello dell'acqua, indicativo di prodotto fluido."},
    ]
  },
  {
    title: "Olio EVO: Diagnosi e Casi Pratici",
    subtitle: "Capitolo 8 (Avanzato) — Normativa, qualità, diagnosi di difetti",
    advanced: true,
    qs: [
      {n:175,type:"mc",q:"Un produttore raccoglie le olive il 15 ottobre, le porta in frantoio il 20 ottobre. Tutto il resto è a norma (spremitura a 25°C, processi meccanici, acidità 0,5%). L'olio può essere chiamato EVO?",opts:["Sì, perché tutti gli altri requisiti sono rispettati.","No: la lavorazione deve avvenire entro 48 ore dalla raccolta. 5 giorni superano largamente questo limite, per cui il prodotto NON può fregiarsi della denominazione «extravergine», anche se altri parametri sono in regola.","Sì, ma solo se l'acidità scende sotto 0,3%.","Solo se le olive sono raccolte a mano."],correct:1,exp:"La normativa è esplicita: lavorazione entro 48 ore dalla raccolta. 5 giorni superano il limite; il prodotto non può essere chiamato EVO indipendentemente dagli altri parametri."},
      {n:176,type:"mc",q:"Un olio raccolto da olive con acidità di partenza dello 0,7% viene perfettamente lavorato. È più probabile che il prodotto finale sia:",opts:["Un EVO di altissima qualità con polifenoli abbondanti.","Un EVO conforme al limite legale (≤ 0,8%) ma di qualità mediocre, con minor quantità di polifenoli rispetto a oli prodotti da olive raccolte a 0,2-0,3%; l'acidità di partenza è un proxy della qualità complessiva: olive raccolte più presto e in migliori condizioni hanno acidità più bassa e più polifenoli.","Un olio lampante non commestibile.","Un olio vergine, non EVO."],correct:1,exp:"Acidità di partenza è un proxy della qualità complessiva del frutto. 0,7% è dentro il limite legale (≤ 0,8% per EVO) ma vicino al margine: indica olive raccolte tardi o in condizioni subottimali, con minor contenuto di polifenoli."},
      {n:177,type:"vf",q:"Un EVO che presenta un forte difetto di rancido viene per legge declassato a olio vergine di oliva, ma se il difetto fosse ancora più grave (per es. ossidazione molto avanzata) potrebbe essere dirottato verso le successive raffinazioni della filiera (olio d'oliva, olio raffinato, fino al lampante non commestibile).",correct:true,exp:"La filiera di declassamento è sequenziale: EVO → vergine (per difetti); spremiture successive con solventi danno olio d'oliva, raffinato, fino al lampante non commestibile."},
      {n:178,type:"mc",q:"Un degustatore di EVO descrive la sensazione «pungente» avvertita in fondo alla gola. Da cosa dipende e perché è considerata una caratteristica POSITIVA?",opts:["Da un eccesso di acidità libera, segno di olio difettoso.","Dai polifenoli, classe di antiossidanti naturali; la pungenza/piccantezza è un indicatore della loro abbondanza, e quindi della qualità dell'olio (sia in termini di shelf-life sia in termini nutrizionali). Per questo è classificata tra le caratteristiche positive insieme a fruttato e amaro.","Da residui di lavorazione meccanica.","Da anidride carbonica intrappolata."],correct:1,exp:"I polifenoli sono antiossidanti naturali; la loro presenza dà la pungenza/piccantezza in gola e contribuisce a stabilità ossidativa e benefici nutrizionali. Per questo le slide la classificano come caratteristica positiva, insieme a fruttato e amaro."},
      {n:179,type:"mc",q:"Un produttore vorrebbe vendere il suo olio non filtrato come «più genuino». Quale obiezione tecnica gli faresti?",opts:["L'olio non filtrato è illegale.","L'olio non filtrato è più aromatico ma meno stabile: i residui solidi in sospensione favoriscono fenomeni ossidativi e fermentativi, abbreviando la durata. Non è «più genuino», ma piuttosto un prodotto da consumare rapidamente; come scelta commerciale è valida solo per produzioni a rotazione veloce.","L'olio non filtrato non ha caratteristiche aromatiche.","L'olio non filtrato è obbligatoriamente lampante."],correct:1,exp:"L'olio non filtrato è effettivamente più aromatico ma meno stabile: i residui solidi accelerano fenomeni ossidativi e fermentativi. Non è «più genuino» nel senso oggettivo: è una scelta che privilegia il profilo aromatico immediato a scapito della shelf-life."},
      {n:180,type:"mc",q:"Hai dimenticato una bottiglia di EVO di alta qualità sul davanzale di una finestra esposta al sole per 6 mesi. Cosa è verosimilmente successo?",opts:["Niente, l'olio si conserva meglio alla luce.","L'olio teme luce, aria e calore: l'esposizione luminosa e termica per mesi avrà avviato processi di ossidazione e «stancamento» (perdita di aromi). Anche se la durata legale è 18-24 mesi e quella ottimale 6-8, queste condizioni accelerano il decadimento ben oltre il normale invecchiamento.","L'olio si è tramutato spontaneamente in vergine.","È diventato lampante."],correct:1,exp:"L'olio teme luce, aria e calore: l'esposizione luminosa e termica per mesi avrà avviato processi di ossidazione e «stancamento» (perdita di aromi). Queste condizioni accelerano il decadimento ben oltre il normale invecchiamento."},
      {n:181,type:"mc",q:"Confronta i metodi di estrazione: pressione (resa 20-30%), centrifuga (15-20%), percolatrice (8-10%). Quale lettura tecnica è più solida?",opts:["La pressione è il metodo migliore in assoluto perché ha la resa più alta.","Le rese non sono comparabili in modo lineare: la pressione (tradizionale, torchio) ottiene il «mosto d'olio» con resa percentuale alta in volume ma include parte dell'acqua di vegetazione; la centrifuga separa rapidamente dall'acqua con buona resa; la percolatrice ha resa minore ma estrae solo la parte grassa pura. La scelta dipende dal compromesso tra resa, qualità e infrastruttura.","La percolatrice è il metodo più diffuso.","La centrifuga è il metodo più antico."],correct:1,exp:"Le rese non sono comparabili in modo lineare: la pressione produce mosto d'olio che include parte di acqua; la centrifuga separa rapidamente; la percolatrice è selettiva su parte grassa pura. Ogni metodo ha trade-off."},
      {n:182,type:"mc",q:"Perché la gramolatura va effettuata sotto i 27°C e non a temperature maggiori che pure favorirebbero una più rapida liberazione dell'olio?",opts:["Perché sopra 27°C l'olio prende fuoco.","Perché la spremitura «a freddo» (< 27°C) è un requisito legale per la denominazione EVO; inoltre temperature più alte degradano polifenoli e composti aromatici termolabili, riducendo la qualità e la shelf-life del prodotto, che proprio sui polifenoli costruisce il suo valore organolettico e nutrizionale.","Per ridurre i costi energetici.","Per impedire la crescita batterica."],correct:1,exp:"La spremitura «a freddo» (< 27°C) è un requisito legale per la denominazione EVO. Inoltre temperature più alte degradano polifenoli e composti aromatici termolabili, riducendo la qualità e la shelf-life."},
      {n:183,type:"mc",q:"Le olive «modificate geneticamente» del modello spagnolo sono piccole. Perché questa caratteristica ha senso per la raccolta meccanica con scavallatrici, e quali sono i trade-off rispetto al modello italiano?",opts:["Le piante più piccole sono solo esteticamente più belle.","Olivi piccoli permettono il passaggio di scavallatrici e una raccolta industriale veloce e a basso costo; il trade-off è che un'agricoltura intensiva di questo tipo riduce la biodiversità varietale (l'Italia ha 450 cultivar, la Spagna ne usa pochissime su larga scala), e privilegia la quantità rispetto alla diversità organolettica e territoriale tipica del prodotto italiano.","Solo le piante piccole producono olive nere.","Le piante grandi producono olio più scadente."],correct:1,exp:"Olivi piccoli permettono il passaggio di scavallatrici e raccolta industriale veloce. Il trade-off: l'Italia ha 450 cultivar e una grande biodiversità; il modello spagnolo intensivo riduce drasticamente la diversità varietale e organolettica."},
      {n:184,type:"mc",q:"Un EVO è descritto come «fruttato ma stanco». Cosa puoi dedurre tecnicamente?",opts:["È un olio appena prodotto.","È un olio che era partito buono (presenta ancora una nota fruttata residua), ma ha già iniziato il processo di perdita degli aromi, fenomeno descritto come «stanco»: tipicamente associato a invecchiamento, esposizione a luce/aria/calore, o conservazione subottimale. Probabile che si trovi nel limite o oltre la finestra ottimale dei 6-8 mesi.","Ha difetti di muffa.","Va declassato a lampante."],correct:1,exp:"Un olio «fruttato ma stanco» è un olio che era partito buono (residua nota fruttata) ma ha già iniziato il decadimento aromatico tipico dello «stancamento». Tipicamente associato a superamento della finestra ottimale dei 6-8 mesi o cattiva conservazione."},
      {n:185,type:"vf",q:"Le DOP/IGP sull'olio sono più diffuse che sulle olive da tavola; questo non è casuale: l'olio è un prodotto trasformato con una catena di valore più lunga (e quindi più sensibile a tutele di filiera), mentre le olive da tavola sono un prodotto di consumo minore in volume e più intercambiabile a livello commerciale.",correct:true,exp:"L'olio è un prodotto con catena di valore lunga e quindi più sensibile alle tutele DOP/IGP che proteggono l'intero processo; le olive da tavola hanno minor volume di consumo e minore differenziazione di filiera."},
      {n:186,type:"mc",q:"Negli assaggi sono presenti EVO di Lago di Garda, Liguria, Toscana, Umbria, Puglia, Sicilia. Perché ha senso assaggiarli in una sequenza che attraversi l'Italia da nord a sud?",opts:["Perché è esteticamente piacevole.","Perché clima, cultivar e tradizioni cambiano lungo la penisola: gli oli del nord (es. Garda) tendono a essere più delicati e fruttati leggeri, quelli del centro più erbacei e pungenti (Toscana), quelli del sud più intensi e maturi; la sequenza didattica permette di costruire un atlante sensoriale della biodiversità italiana (450 cultivar) e di allenare il palato a riconoscere terroir distinti.","Per dimostrare che gli oli del Nord sono superiori a quelli del Sud.","Perché la legge impone questa sequenza."],correct:1,exp:"Lungo l'Italia clima, cultivar e tradizioni cambiano: oli del nord tendono al fruttato leggero; del centro all'erbaceo pungente; del sud all'intenso e maturo. La sequenza didattica permette di costruire un atlante sensoriale della biodiversità italiana."},
      {n:187,type:"mc",q:"Un produttore ti dice: «da quest'anno la mia produzione è dimezzata, eppure non ho cambiato nulla rispetto allo scorso anno, in cui era stata ottima». Cosa è plausibile sia successo?",opts:["Sicuramente la pianta è malata.","È molto probabilmente la produzione alternata (resa biennale): l'olivo, dopo un'annata abbondante che richiede molta energia al frutto, produce naturalmente meno l'anno successivo. È un fenomeno fisiologico normale, non un sintomo di patologia.","Si tratta di un attacco di mosca dell'olivo.","La cultivar è cambiata spontaneamente."],correct:1,exp:"La produzione alternata (resa biennale) è descritta esplicitamente: dopo un'annata abbondante, il frutto richiede molta energia alla pianta che produce naturalmente meno l'anno seguente. È un fenomeno fisiologico normale, non patologico."},
    ]
  }
];

const STORAGE_KEY = 'quiz_sensoriale_v1';
let state = { answers: {}, marked: {} };

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) state = JSON.parse(s);
  } catch(e){}
}

function buildQuiz() {
  const main = document.getElementById('quiz-main');
  main.innerHTML = '';
  const labels = ['A','B','C','D'];

  chapters.forEach((ch, ci) => {
    const chDiv = document.createElement('div');
    chDiv.className = 'chapter-section';

    if (ch.sectionBreak) {
      const totalBase = chapters.filter(c => !c.advanced).reduce((a,c) => a+c.qs.length, 0);
      const totalAdv  = chapters.filter(c =>  c.advanced).reduce((a,c) => a+c.qs.length, 0);
      chDiv.insertAdjacentHTML('beforeend', `
        <div class="section-divider">
          <div class="section-divider-banner">
            <div class="adv-badge">⚡ Quiz Avanzato</div>
            <div class="adv-title">Ragionamento, Analisi e Applicazione</div>
            <div class="adv-subtitle">Questo quiz NON contiene domande di pura memorizzazione: richiede di ragionare sui meccanismi fisiologici, confrontare tecniche e prodotti, applicare le nozioni a casi pratici e diagnosticare errori. Tutte le opzioni errate sono plausibili — leggi attentamente.</div>
            <div class="adv-stats">
              <div class="adv-stat"><span class="adv-stat-num">${totalAdv}</span>&nbsp;domande avanzate</div>
              <div class="adv-stat"><span class="adv-stat-num">4</span>&nbsp;capitoli</div>
              <div class="adv-stat"><span class="adv-stat-num">${totalBase + totalAdv}</span>&nbsp;domande totali</div>
            </div>
          </div>
        </div>`);
    }

    const isAdv = !!ch.advanced;
    const lineClass = isAdv ? 'chapter-line adv' : 'chapter-line';
    const labelClass = isAdv ? 'chapter-label adv' : 'chapter-label';
    const capLabel = isAdv ? `Capitolo ${ci+1} — Avanzato` : `Capitolo ${ci+1}`;

    chDiv.insertAdjacentHTML('beforeend', `
      <div class="chapter-header">
        <div class="${lineClass}"></div>
        <div class="${labelClass}">${capLabel}</div>
        <div class="${lineClass}"></div>
      </div>
      <h2 class="chapter-title">${ch.title}</h2>
      <p class="chapter-subtitle">${ch.subtitle}</p>`);

    ch.qs.forEach(q => {
      const card = document.createElement('div');
      card.className = 'question-card' + (isAdv ? ' adv-card' : '');
      card.id = `q${q.n}`;

      const ans = state.answers[q.n];
      const isMarked = !!state.marked[q.n];
      if (ans !== undefined) {
        const isCorrect = (q.type === 'vf') ? (ans === q.correct) : (ans === q.correct);
        card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
      }
      if (isMarked) card.classList.add('marked');

      const numClass = isAdv ? 'q-number adv' : 'q-number';
      let innerHtml = `
        <div class="q-meta">
          <span class="${numClass}">Q${q.n}</span>
          <span class="q-type-badge">${q.type === 'vf' ? 'Vero / Falso' : 'Scelta multipla'}</span>
          ${ans !== undefined ? `<span class="answered-stamp ${ans===q.correct?'ok':'ko'}">${ans===q.correct?'✓ Corretto':'✗ Sbagliato'}</span>` : ''}
          <button class="mark-btn ${isMarked?'active':''}" onclick="toggleMark(${q.n})" title="Segna per revisione">🔖</button>
        </div>
        <div class="q-text">${q.q}</div>`;

      const isAnswered = ans !== undefined;

      if (q.type === 'mc') {
        innerHtml += `<div class="options">`;
        q.opts.forEach((opt, oi) => {
          let cls = '';
          if (isAnswered) {
            if (oi === q.correct) cls = 'correct';
            else if (oi === ans) cls = 'wrong';
          }
          const icon = isAnswered ? (oi === q.correct ? ' <span class="opt-icon">✓</span>' : (oi === ans ? ' <span class="opt-icon">✗</span>' : '')) : '';
          innerHtml += `<button class="option-btn ${cls}" ${isAnswered?'disabled':''} onclick="answer(${q.n},${oi})">
            <span class="opt-letter">${labels[oi]}</span>
            <span>${opt}</span>${icon}
          </button>`;
        });
        innerHtml += `</div>`;
      } else {
        innerHtml += `<div class="vf-options">`;
        [true, false].forEach(val => {
          let cls = '';
          if (isAnswered) {
            if (val === q.correct) cls = 'correct';
            else if (val === ans) cls = 'wrong';
          }
          innerHtml += `<button class="vf-btn ${cls}" ${isAnswered?'disabled':''} onclick="answer(${q.n},${val})">
            ${val ? '✓ Vero' : '✗ Falso'}
          </button>`;
        });
        innerHtml += `</div>`;
      }

      if (isAnswered) {
        const isCorrect = ans === q.correct;
        const correctLabel = q.type === 'vf'
          ? (q.correct ? 'Vero' : 'Falso')
          : `${labels[q.correct]}) ${q.opts[q.correct]}`;
        innerHtml += `<div class="feedback ${isCorrect?'correct-fb':'wrong-fb'} show">
          <strong>${isCorrect ? '✓ Risposta corretta!' : '✗ Risposta errata'}</strong>
          ${!isCorrect ? `<span class="correct-answer">Risposta corretta: ${correctLabel}</span>` : ''}
          ${q.exp}
        </div>`;
      } else {
        innerHtml += `<div class="feedback" id="fb${q.n}"></div>`;
      }

      card.innerHTML = innerHtml;
      chDiv.appendChild(card);
    });

    main.appendChild(chDiv);
  });

  updateProgress();
}

function answer(qn, val) {
  const allQs = chapters.flatMap(c => c.qs);
  const q = allQs.find(x => x.n === qn);
  if (!q || state.answers[qn] !== undefined) return;

  state.answers[qn] = val;
  saveState();

  const card = document.getElementById(`q${qn}`);
  const isCorrect = val === q.correct;
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  card.querySelectorAll('.option-btn, .vf-btn').forEach(btn => { btn.disabled = true; });

  const labels = ['A','B','C','D'];
  if (q.type === 'mc') {
    card.querySelectorAll('.option-btn').forEach((btn, i) => {
      if (i === q.correct) { btn.classList.add('correct'); btn.insertAdjacentHTML('beforeend','<span class="opt-icon">✓</span>'); }
      else if (i === val) { btn.classList.add('wrong'); btn.insertAdjacentHTML('beforeend','<span class="opt-icon">✗</span>'); }
    });
  } else {
    card.querySelectorAll('.vf-btn').forEach((btn, i) => {
      const bval = i === 0;
      if (bval === q.correct) btn.classList.add('correct');
      else if (bval === val) btn.classList.add('wrong');
    });
  }

  const correctLabel = q.type === 'vf' ? (q.correct ? 'Vero' : 'Falso') : `${labels[q.correct]}) ${q.opts[q.correct]}`;
  const fb = card.querySelector('.feedback');
  if (fb) {
    fb.className = `feedback ${isCorrect?'correct-fb':'wrong-fb'} show`;
    fb.innerHTML = `<strong>${isCorrect ? '✓ Risposta corretta!' : '✗ Risposta errata'}</strong>
      ${!isCorrect ? `<span class="correct-answer">Risposta corretta: ${correctLabel}</span>` : ''}
      ${q.exp}`;
  }

  const meta = card.querySelector('.q-meta');
  const existing = meta.querySelector('.answered-stamp');
  if (existing) existing.remove();
  const stamp = document.createElement('span');
  stamp.className = `answered-stamp ${isCorrect?'ok':'ko'}`;
  stamp.textContent = isCorrect ? '✓ Corretto' : '✗ Sbagliato';
  const markBtn = meta.querySelector('.mark-btn');
  meta.insertBefore(stamp, markBtn);

  updateProgress();
  showToast(isCorrect ? '✓ Corretto!' : '✗ Sbagliato');
}

function toggleMark(qn) {
  if (state.marked[qn]) { delete state.marked[qn]; }
  else { state.marked[qn] = true; }
  saveState();
  const btn = document.querySelector(`#q${qn} .mark-btn`);
  const card = document.getElementById(`q${qn}`);
  if (btn) btn.classList.toggle('active', !!state.marked[qn]);
  if (card) card.classList.toggle('marked', !!state.marked[qn]);
  showToast(state.marked[qn] ? '🔖 Segnata per revisione' : '🔖 Segnalazione rimossa');
}

function filterQuestions(type) {
  const allQs = chapters.flatMap(c => c.qs);
  document.querySelectorAll('.question-card').forEach(card => {
    const qn = parseInt(card.id.replace('q',''));
    const q = allQs.find(x => x.n === qn);
    let show = true;
    if (type === 'unanswered') show = state.answers[qn] === undefined;
    else if (type === 'marked') show = !!state.marked[qn];
    else if (type === 'wrong') show = state.answers[qn] !== undefined && state.answers[qn] !== q.correct;
    card.classList.toggle('hidden', !show);
  });
  document.querySelectorAll('.chapter-section').forEach(sec => {
    const cards = sec.querySelectorAll('.question-card');
    const anyVisible = Array.from(cards).some(c => !c.classList.contains('hidden'));
    sec.style.display = anyVisible ? '' : 'none';
  });
  const counts = {all:'tutte',unanswered:'da rispondere',marked:'segnate',wrong:'sbagliate'};
  showToast(`Filtro: ${counts[type]}`);
}

function updateProgress() {
  const allQs = chapters.flatMap(c => c.qs);
  const total = allQs.length;
  const answered = Object.keys(state.answers).length;
  const correct = allQs.filter(q => state.answers[q.n] === q.correct).length;
  document.getElementById('score-badge').textContent = `${correct} / ${answered}`;
  document.getElementById('progress-bar').style.width = `${(answered/total)*100}%`;
}

function showResults() {
  const allQs = chapters.flatMap(c => c.qs);
  const total = allQs.length;
  const answered = Object.keys(state.answers).length;
  const correct = allQs.filter(q => state.answers[q.n] === q.correct).length;
  const wrong = answered - correct;
  const pct = answered > 0 ? Math.round((correct/answered)*100) : 0;

  const emoji = pct >= 85 ? '🎉' : pct >= 65 ? '💪' : '📚';
  const scoreClass = pct >= 85 ? 'good' : pct >= 65 ? 'ok' : '';
  const msg = pct >= 85 ? 'Ottimo risultato!' : pct >= 65 ? 'Buon lavoro!' : 'Continua a studiare!';

  const baseChaps = chapters.filter(c => !c.advanced);
  const advChaps  = chapters.filter(c =>  c.advanced);

  function chScore(ch) {
    const c = ch.qs.filter(q => state.answers[q.n] === q.correct).length;
    const a = ch.qs.filter(q => state.answers[q.n] !== undefined).length;
    return `${c}/${a}`;
  }

  let html = `
    <div class="results-emoji">${emoji}</div>
    <div class="results-title">${msg}</div>
    <div class="results-score-big ${scoreClass}">${pct}%</div>
    <div class="results-sub">${correct} corrette su ${answered} risposte (${total - answered} non risposte)</div>
    <div class="results-breakdown">
      <div class="breakdown-item green"><span class="bi-num">${correct}</span><span class="bi-label">Corrette</span></div>
      <div class="breakdown-item red"><span class="bi-num">${wrong}</span><span class="bi-label">Sbagliate</span></div>
      <div class="breakdown-item yellow"><span class="bi-num">${total - answered}</span><span class="bi-label">Non risposte</span></div>
      <div class="breakdown-item"><span class="bi-num">${total}</span><span class="bi-label">Totale</span></div>
    </div>
    <div class="results-section-label">Quiz Base — Capitoli 1–4</div>`;

  baseChaps.forEach(ch => {
    html += `<div class="results-chapter"><span>${ch.title}</span><span class="ch-score">${chScore(ch)}</span></div>`;
  });

  html += `<div class="results-section-label adv">⚡ Quiz Avanzato — Capitoli 5–8</div>`;
  advChaps.forEach(ch => {
    html += `<div class="results-chapter adv-chapter"><span>${ch.title}</span><span class="ch-score">${chScore(ch)}</span></div>`;
  });

  html += `<div class="results-actions">
    <button class="res-btn secondary" onclick="document.getElementById('results-panel').classList.remove('show')">← Chiudi</button>
    <button class="res-btn primary" onclick="confirmReset()">🔄 Ricomincia</button>
  </div>`;

  document.getElementById('results-box').innerHTML = html;
  document.getElementById('results-panel').classList.add('show');
}

function confirmReset() {
  if (confirm('Vuoi davvero ricominciare? Tutti i progressi verranno persi.')) {
    state = { answers: {}, marked: {} };
    saveState();
    document.getElementById('results-panel').classList.remove('show');
    buildQuiz();
    showToast('🔄 Quiz riavviato!');
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

loadState();
buildQuiz();
</script>
</body>
</html>
